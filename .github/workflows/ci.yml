name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Eyle dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Install Adapter dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Verify release architecture
        run: python -B -m eyle.devtools.release_identity

      - name: Run Eyle tests
        run: python -m pytest -q

      - name: Run Adapter tests
        run: python -m pytest -q server/tests

      - name: Compile Python sources
        run: python -m compileall -q eyle llm web server main.py
