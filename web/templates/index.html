<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyle</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">EYLE</span>
      <span class="conn-dot" id="connDot" title="conexão com o worker"></span>
      <button class="token-btn" id="tokenBtn" type="button" aria-label="Informar ou trocar o token da API" title="Informar ou trocar o token da API">token</button>
      <button class="token-btn" id="clearConversationBtn" type="button" aria-label="Limpar conversa preservando a memoria cognitiva" title="Limpar conversa preservando Memory Graph">limpar chat</button>
    </div>
    <div class="project-info" id="projectInfo">
      <span class="pi-line">carregando…</span>
    </div>
  </header>

  <div class="activity" id="activity" aria-hidden="true">
    <div class="activity-track">
      <span class="stage lit" id="jobState">tarefa aguardando</span>
    </div>
  </div>

  <main class="log" id="log">
    <div class="empty-state" id="emptyState">
      <p>Nenhuma mensagem ainda.</p>
      <p class="empty-sub">Converse sobre código ou peça uma análise, criação, correção ou teste no workspace atual.</p>
    </div>
  </main>

  <footer class="composer">
    <textarea
      id="input"
      placeholder="Pergunte algo sobre o projeto…"
      rows="1"
      autofocus
    ></textarea>
    <button id="sendBtn" type="button" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </footer>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
